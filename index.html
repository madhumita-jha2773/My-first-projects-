<!DOCTYPE html>
<html lang="en">

    <title>By code Traversal</title>

<body>
    <h1> DIGITAL CALCULATOR </h1>
    <div class="Calculater">

            <button onclick="Chutky1()">Ac</button>

            <button class="operator" onclick="Chutky4('/')">÷</button>

        </div>
        <div>
            <button onclick="Chutky5()">7</button>
            <button onclick="Chutky6()">8</button>
            <button onclick="Chutky7()">9</button>
            <button onclick="Chutky8()">*</button>

        </div>
        <div>
            <button onclick="Chutky9()">4</button>
            <button onclick="Chutky10()">5</button>
            <button onclick="Chutky11()">6</button>
            <button onclick="Chutky12()">-</button>

        </div>

        <div>
            <button onclick="Chutky13()">1</button>
            <button onclick="Chutky14()">2</button>
            <button onclick="Chutky15()">3</button>
            <button onclick="Chutky16()">+</button>

        </div>

        <div>
            <button onclick="Chutky17()">00</button>
            <button onclick="Chutky18()">0</button>
            <button onclick="Chutky19()">.</button>
            <button onclick="Chutky20()">=</button>

        </div>

    </div>
    <script src="script.js"></script>


</body>
